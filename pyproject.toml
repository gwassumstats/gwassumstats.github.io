[project]
name = "gwassumstats"
version = "0.1.0"
description = "Catalog of a collection of GWAS summary statistics"
requires-python = ">=3.12"
dependencies = ["cryptography>=44", "numpy>=2", "pandas>=2.2"]

[dependency-groups]
dev = ["pytest>=8"]
qc = ["submitit>=1.5"]  # on O2 only: qc/scan.py

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
